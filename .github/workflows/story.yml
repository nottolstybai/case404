# История дня: раз в день нейросеть пишет короткую развязку к делу.
# Модели по очереди (порядок — в scripts/story.mjs): GPT-4o mini, Gemini 3.8 Flash, GPT-4.1 mini, …
# Gemini — ключ в Settings → Secrets and variables → Actions → секрет GEMINI_API_KEY;
# GitHub Models — встроенный токен Actions (право models: read).
# Запустить вручную: Actions → «История дня» → Run workflow.
name: История дня

on:
  schedule:
    # дважды в день: если модели были недоступны, второй запуск допишет недостающее (готовые не трогает)
    - cron: '17 9 * * *'
    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Переписать и готовые истории'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  models: read # GitHub Models: GPT-4o mini, GPT-4.1 mini, DeepSeek

concurrency:
  group: story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # обычно 1–2 минуты; если модели совсем не отвечают — не висим долго
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Написать истории
        run: node scripts/story.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
      - name: Сохранить в репозиторий
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p stories
          git add stories
          if git diff --cached --quiet; then echo "Новых историй нет"; exit 0; fi
          git commit -m "Истории дел"
          git push
          gh api --method POST "repos/${{ github.repository }}/pages/builds" || echo "Pages пересоберётся сам"
